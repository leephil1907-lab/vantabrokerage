# PRIMEVEST Render Blueprint
# Connects the web app and worker to the existing Render PostgreSQL resource Primevest.
# Order execution remains PAPER-only. Customer crypto deposits require manual finance review.

services:
  - type: web
    name: primevest-web
    runtime: node
    plan: pro
    pullRequestPreviewsEnabled: true
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed-review && STAFF_BOOTSTRAP=one-time-2026-11 node scripts/bootstrap-staff.mjs
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: Primevest
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: primevest-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
      - key: EXECUTION_MODE
        value: paper
      - key: MARKET_DATA_MODE
        value: live
      - key: FINNHUB_API_KEY
        sync: false

  - type: worker
    name: primevest-worker
    runtime: node
    plan: standard
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npx prisma generate
    startCommand: node scripts/wait-for-database.mjs && npm run worker
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: Primevest
          property: connectionString
      - key: EXECUTION_MODE
        value: paper
      - key: MARKET_DATA_MODE
        value: live
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: primevest-web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: Primevest
    databaseName: primevest_postgres
    user: primevest_postgres_user
    plan: pro-4gb
    region: frankfurt
    ipAllowList: []
